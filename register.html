
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrace | TechSupport</title>
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/auth.js" defer></script>
</head>
<body>

    <div class="auth-container">
        <a href="index.html" class="logo">Tech<span>Support</span></a>

        <div class="auth-card">
            <h1>Vytvořit účet</h1>
            <p class="subtitle">Připoj se k TechSupportu</p>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Jméno</label>
                    <input type="text" id="name" placeholder="Tvoje jméno" required>
                </div>

                <div class="form-group">
                    <label for="registerEmail">E-mail</label>
                    <input type="email" id="registerEmail" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Heslo</label>
                    <input type="password" id="registerPassword" placeholder="Minimálně 6 znaků" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Potvrzení hesla</label>
                    <input type="password" id="confirmPassword" placeholder="Zopakuj heslo" required>
                </div>

                <button type="submit" class="auth-button">Zaregistrovat se</button>

                <p id="registerMessage" class="message"></p>
            </form>

            <p class="switch-text">
                Už máš účet?
                <a href="login.html">Přihlas se</a>
            </p>
        </div>

        <a href="index.html" class="back-link">← Zpět na hlavní stránku</a>
    </div>

</body>
</html>
